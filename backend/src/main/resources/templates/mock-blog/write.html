<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모의 블로그 - 글쓰기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #111827;
            font-weight: 700;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea {
            height: 300px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }
        button {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-submit {
            background-color: #4f46e5;
            color: white;
        }
        .btn-submit:hover {
            background-color: #4338ca;
        }
        .btn-cancel {
            background-color: #f3f4f6;
            color: #4b5563;
        }
        .btn-cancel:hover {
            background-color: #e5e7eb;
        }
        .nav-links {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a th:href="@{/mock-blog/posts}">← 글 목록 보기</a>
            <a th:href="@{/mock-blog/logout}">로그아웃</a>
        </div>
        <h2>새 블로그 포스트 작성</h2>
        <form th:action="@{/mock-blog/write}" method="post">
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" required placeholder="글 제목을 입력하세요">
            </div>
            <div class="form-group">
                <label for="tags">태그</label>
                <input type="text" id="tags" name="tags" placeholder="쉼표(,)로 구분하여 입력하세요 (예: React, IT)">
            </div>
            <div class="form-group">
                <label for="content">본문 내용</label>
                <textarea id="content" name="content" required placeholder="본문 내용을 입력하세요"></textarea>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="location.href='/mock-blog/posts'">취소</button>
                <button type="submit" id="submit-btn" class="btn-submit">등록하기</button>
            </div>
        </form>
    </div>
</body>
</html>
