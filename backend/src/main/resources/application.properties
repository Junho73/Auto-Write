server.port=8080

# Anthropic (Claude) API Key — must be supplied via the ANTHROPIC_API_KEY environment variable.
# Never hardcode a real key here; this file is committed to git.
anthropic.api.key=${ANTHROPIC_API_KEY}

# Directory to save Playwright screenshots (relative to backend working dir)
screenshot.upload.dir=uploads

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false

# Embedded file-based H2 database — persists scheduled jobs & post history across restarts
spring.datasource.url=jdbc:h2:file:./data/blogwriter
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Single-threaded: MOCK-target automation launches a real headed browser, avoid two running at once
spring.task.scheduling.pool-size=1
