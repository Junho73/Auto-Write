server.port=8080

# OpenAI API Key — must be supplied via the OPENAI_API_KEY environment variable.
# Never hardcode a real key here; this file is committed to git.
openai.api.key=${OPENAI_API_KEY}

# Directory to save Playwright screenshots (relative to backend working dir)
screenshot.upload.dir=uploads

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false

# Embedded file-based H2 database — persists scheduled jobs & post history across restarts
spring.datasource.url=jdbc:h2:file:./data/blogwriter
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Where the Velog authenticated session (storageState) is saved after the one-time manual login
velog.session.storage-path=./data/velog-session.json

# Single-threaded: automation launches a real headed browser, avoid two running at once
spring.task.scheduling.pool-size=1
