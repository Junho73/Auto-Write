# 8080 is unusable on this dev machine — something reserves it invisibly (doesn't show
# in netstat/Get-NetTCPConnection, not an HTTP.sys URL ACL, not a port-exclusion range;
# root cause unresolved). 8091 is confirmed free.
server.port=8091
server.address=127.0.0.1

# Anthropic (Claude) API Key — supply via the ANTHROPIC_API_KEY environment variable, or via
# the Settings screen (saved to a gitignored local file, ApiKeySettingsService). Never hardcode
# a real key here; this file is committed to git. Empty default so startup never fails just
# because the env var isn't set for this shell session.
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Directory to save Playwright screenshots (relative to backend working dir)
screenshot.upload.dir=uploads

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false

# Embedded file-based H2 database — persists scheduled jobs & post history across restarts
spring.datasource.url=jdbc:h2:file:./data/blogwriter
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Single-threaded: MOCK-target automation launches a real headed browser, avoid two running at once
spring.task.scheduling.pool-size=1
